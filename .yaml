## Implemented Tasks

### Task 1 – Decision Tree Analysis
- Manual computation of entropy
- Information gain calculation
- Attribute selection and justification

### Task 2 – K-Means Clustering
- Data preprocessing and standardisation
- K-Means clustering (k = 3)
- Cluster visualisation and interpretation

### Task 3 – Regression Analysis
- Polynomial regression (degree 2)
- Model evaluation using R² and MSE
- Analysis of portfolio risk–return relationship

